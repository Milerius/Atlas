codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "60...100"

  status:
    project:
      default:
        target: 95%
        threshold: 1%
    patch:
      default:
        target: 70%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

github_checks:
  annotations: true

ignore:
  # BDD harness (Cucumber World + step definitions) is test infrastructure,
  # not API surface. Mirror the CI llvm-cov filter so codecov agrees.
  - "crates/atlas-scenarios/**"

name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutation Testing
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-mutants --locked
      - run: cargo mutants --workspace --timeout 300
      - name: Upload mutation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-report
          path: mutants.out/

  coverage-full:
    name: Full Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # See ci.yml: --branch SIGSEGVs llvm-cov on async-trait crates.
      - run: cargo +nightly llvm-cov --workspace --all-features --html
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html/

  kani:
    name: Kani Proofs
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Run Kani proofs
        uses: model-checking/kani-github-action@v1
        with:
          args: -p atlas-verify
      - name: Extract proof results
        if: always()
        run: |
          echo "## Kani Proof Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E '(VERIFICATION|RESULT)' kani-output.txt 2>/dev/null || echo "No results captured"
          echo '```' >> $GITHUB_STEP_SUMMARY

  bolero-extended:
    name: Bolero Extended (fuzz mode)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run property tests with extended iterations
        run: cargo test -p atlas-verify --release -- --test-threads=1
        env:
          BOLERO_RANDOM_SEED: "0"
          BOLERO_RUNS: "100000"
